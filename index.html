<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>制服申請 Uniform Request</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: single-column wizard (確認 → 質問 → 申請書), with a form-style sheet at the end */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --fg:#1b2233; --muted:#5d6678; --line:#d6dae3;
  --accent:#243b6b; --accent-fg:#ffffff; --mark:#e3b505; --ok:#1f7a4d; --ok-bg:#e4f3ea;
  --bad:#b3261e; --bad-bg:#fbe9e7; --warn-bg:#fff4d6; --warn:#7a5a00;
  --f-body:'Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121723; --surface:#1b2233; --fg:#e8ebf2; --muted:#9aa4b8; --line:#33405a;
  --accent:#8fb0f2; --accent-fg:#0f1626; --mark:#e3b505; --ok:#6fd3a0; --ok-bg:#16352a;
  --bad:#ff9d94; --bad-bg:#3b1e1b; --warn-bg:#3a3014; --warn:#f1d27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121723; --surface:#1b2233; --fg:#e8ebf2; --muted:#9aa4b8; --line:#33405a;
  --accent:#8fb0f2; --accent-fg:#0f1626; --mark:#e3b505; --ok:#6fd3a0; --ok-bg:#16352a;
  --bad:#ff9d94; --bad-bg:#3b1e1b; --warn-bg:#3a3014; --warn:#f1d27a; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;padding-inline:16px;padding-block:20px 56px}
.wrap{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font-size:1.35rem;margin:0;line-height:1.4;text-wrap:balance}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted)}
h2{font-size:1.1rem;margin:0 0 4px}
.lang{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.lang button{border:0;background:var(--surface);color:var(--fg);padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);font-weight:700}
.steps{display:flex;gap:8px;margin:0;padding:0;list-style:none}
.steps li{flex:1;min-width:0;border-top:4px solid var(--line);padding-top:6px;font-size:.8rem;color:var(--muted)}
.steps li.on{border-color:var(--mark);color:var(--fg);font-weight:700}
.steps li.done{border-color:var(--accent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted);font-size:.85rem}
label{font-weight:500;font-size:.9rem}
input[type=text],input[type=date],select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:40px;width:100%;box-sizing:border-box}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px;min-width:0}
.field{display:flex;flex-direction:column;gap:4px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{margin-top:6px;width:18px;height:18px;flex:none}
.btn{font:inherit;font-weight:700;border:0;border-radius:6px;padding:11px 20px;background:var(--accent);color:var(--accent-fg);cursor:pointer;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.msg{border-radius:6px;padding:12px 14px;font-size:.9rem}
.msg.ok{background:var(--ok-bg);color:var(--ok)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.warn{background:var(--warn-bg);color:var(--warn)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.q{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.q .qt{font-weight:700}
.q label.opt{display:flex;gap:10px;align-items:flex-start;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:6px;cursor:pointer}
.q label.opt input{margin-top:5px;flex:none}
.q.wrong label.opt:has(input:checked){border-color:var(--bad);background:var(--bad-bg)}
.q.right label.opt:has(input:checked){border-color:var(--ok);background:var(--ok-bg)}
.why{font-size:.85rem;color:var(--bad)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.items{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
table.items th,table.items td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:middle}
table.items th{background:var(--bg);font-weight:500;font-size:.8rem}
table.items td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.items select,table.items input{min-height:34px;padding:4px 6px}
table.items input.size{width:84px}
table.items select.qty{width:68px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;padding:4px 2px}
.total .v{font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.sub{font-size:.78rem;color:var(--muted);display:block;font-weight:400}
/* printed-style sheet: always light paper */
.sheet{background:#fff;color:#111;border:1px solid #999;padding:22px 24px;font-family:'Noto Sans JP','Yu Gothic',sans-serif;font-size:13px;line-height:1.6}
.sheet h3{text-align:center;font-size:20px;letter-spacing:.3em;margin:0 0 14px}
.sheet .meta{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.sheet table{border-collapse:collapse;width:100%}
.sheet th,.sheet td{border:1px solid #333;padding:3px 6px}
.sheet td.n{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.c{text-align:center}
.sheet .circ{display:inline-block;border:1.5px solid #111;border-radius:50%;padding:0 6px}
.sheet .sumrow td{font-weight:700;font-size:14px}
.sheet .office{margin-top:14px;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;border:1px solid #333}
.sheet .office div{padding:3px 6px;border-left:1px solid #333;min-height:54px}
.sheet .office div:first-child{border-left:0}
.sheetwrap{overflow-x:auto}
.sheetwrap .sheet{min-width:560px}
.ok-badge{display:inline-block;background:var(--ok-bg);color:var(--ok);border-radius:4px;padding:1px 8px;font-size:.8rem;font-weight:700}
@media print{
  body{background:#fff;padding:0}
  .no-print{display:none!important}
  .sheet{border:0;padding:0}
}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>

function addMonths(d,n){var y=d.getFullYear(),m=d.getMonth()+n,day=d.getDate();var last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last));}

/* eligibility: returns {ok, msgKey, next} */
function baseElig(){
  if(S.first) return {ok:true, kind:'first'};
  var d=parseISO(S.last);
  if(!d) return {ok:false, kind:'need'};
  if(d>today()) return {ok:false, kind:'future'};
  var nx=addMonths(d,6);
  if(nx<=today()) return {ok:true, kind:'six'};
  return {ok:false, kind:'wait', next:nx};
}
/* urgent (torn / broken) can skip the 6-month wait, but only with a photo */
function needPhoto(){ return S.urgent && !baseElig().ok && baseElig().kind!=='future'; }
function eligibility(){
  var b=baseElig();
  if(b.ok) return b;
  if(needPhoto()) return {ok:!!S.photo, kind:S.photo?'urgent':'photo'};
  return b;
}
function processPhoto(file){
  if(!file) return;
  var rd=new FileReader();
  rd.onerror=function(){ S.photoErr=t('photo_bad'); refreshStep1(); };
  rd.onload=function(){
    var img=new Image();
    img.onerror=function(){ S.photoErr=t('photo_bad'); refreshStep1(); };
    img.onload=function(){
      var out='', sizes=[1000,800,600];
      for(var si=0;si<sizes.length&&!out;si++){
        var sc=Math.min(1,sizes[si]/Math.max(img.width,img.height));
        var c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*sc)); c.height=Math.max(1,Math.round(img.height*sc));
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        for(var q=0.72;q>=0.35;q-=0.1){ var u=c.toDataURL('image/jpeg',q); if(u.length<=170000){ out=u; break; } }
      }
      if(!out){ S.photoErr=t('photo_bad'); } else { S.photo=out; S.photoErr=''; }
      refreshStep1();
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

function checkQuiz(){

    '<table><thead><tr><th colspan="2">支給品目</th><th>(負担金額)</th><th>型番</th><th>サイズ</th><th>数量</th><th>金額</th></tr></thead><tbody>'+rows+
    '<tr class="sumrow"><td colspan="6" class="c">合　計　金　額</td><td class="n">'+totalAmt().toLocaleString('en-US')+'</td></tr></tbody></table>'+
       '<div class="office"><div>※ 総務課使用欄</div><div></div><div>支給担当</div><div>給与担当</div></div>'+
    '<div class="office" style="border-top:0;grid-template-columns:2fr 1fr 1fr 1fr"><div></div><div></div><div></div><div>控除額</div></div></div>';
}

function sheetText(){
  var f=S.f,d=parseISO(f.date)||today();

function renderSheet(){

function render(){
  var body = S.view==='records'?renderRecords():S.step===1?renderStep1():S.step===2?renderStep2():renderStep3();

  document.documentElement.lang = L;

/* ---------- events ---------- */
function refreshStep1(){
  var keep={a:document.activeElement&&document.activeElement.id};
  render(); var el=keep.a&&document.getElementById(keep.a); if(el&&el.focus) el.focus();
}
$app.addEventListener('click',function(ev){
  var b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.lang){L=b.dataset.lang;render();return;}
  var id=b.id;
  if(id==='to2'){var e=eligibility(); if(e.ok){S.step=2;S.err='';render();} else {S.err=(e.kind==='need')?'need':'';render();} }
  else if(id==='photodel'){ S.photo=''; S.photoErr=''; render(); }
  else if(id==='to1'){S.step=1;render();}
  else if(id==='check'){ S.checked=true; render(); }
  else if(id==='retry'){ newOrder(); render(); window.scrollTo(0,0); }
  else if(id==='to3'){ S.passed=true; S.step=3; S.err=''; if(needPhoto()&&!S.f.kind)S.f.kind='2'; render(); window.scrollTo(0,0); }
  else if(id==='to2b'){ S.step=2; render(); }
  else if(id==='make'){ makeForm(); }
  else if(id==='edit'){ S.made=false; render(); }
  else if(id==='restart'){ var d=iso(today()); S={step:1,view:'',save:'',docId:'',records:null,rerr:'',first:false,last:'',urgent:false,photo:'',photoErr:'',answers:{},order:null,checked:false,passed:false,f:{date:d,dept:'',team:'',deptOther:'',empno:'',name:'',kind:'',qty:{},size:{},d1:false,d2:false,d3:false},made:false,err:''}; render(); window.scrollTo(0,0); }
  else if(id==='copy'){ copyText(b); }
  else if(id==='rec'){ openRecords(); }
  else if(id==='recback'){ api('POST','/api/admin/logout').catch(function(){}); S.view=''; UNLOCKED=false; PHOTOVIEW=''; PASSERR=false; render(); }
  else if(id==='unlock'){ tryUnlock(); }
  else if(id==='photoclose'){ PHOTOVIEW=''; render(); }
  else if(b.dataset.photo){ showPhoto(b.dataset.photo); }
  else if(id==='tabrec'){ TAB='rec'; render(); }
  else if(id==='tabros'){ TAB='ros'; RMSG=''; render(); }
  else if(id==='rosadd'){ rosterAdd(); }
  else if(id==='rosbulk'){ rosterBulk(); }
  else if(b.dataset.del){ rosterDel(b.dataset.del); }
  else if(id==='csv'){ saveCSV(); }
  else if(id==='gsync'){ syncSheets(); }
  else if(id==='tsv'){ copyMatrix(b); }
});
$app.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.id==='first'){S.first=el.checked; if(el.checked)S.last=''; S.err=''; refreshStep1();}
  else if(el.id==='last'){S.last=el.value; S.err=''; refreshStep1();}
  else if(el.id==='photo'){ processPhoto(el.files&&el.files[0]); }
  else if(el.id==='urgent'){S.urgent=el.checked; S.err=''; if(el.checked&&!S.f.kind)S.f.kind='2'; refreshStep1();}
  else if(el.name&&/^q\d+$/.test(el.name)){ S.answers[+el.name.slice(1)]=+el.value; if(S.checked){S.checked=false;render();} }
  else if(el.dataset&&el.dataset.qty!==undefined){ setQty(+el.dataset.qty, +el.value); }
  else if(el.name==='kind'){ S.f.kind=el.value; }
  else if(el.dataset&&el.dataset.size!==undefined){ S.f.size[+el.dataset.size]=el.value; }
  else if(el.dataset&&el.dataset.decl){ S.f[el.dataset.decl]=el.checked; }
  else if(el.id==='date'){ S.f.date=el.value; }
  else if(el.id==='team'){ S.f.team=el.value; }
  else if(el.id==='empno'){ S.f.empno=el.value; lookupEmp(); }
  else if(el.id==='dept'){ S.f.dept=el.value; S.f.team=''; render(); var o=document.getElementById(el.value==='__other'?'deptOther':'dept'); if(o)o.focus(); }
});
$app.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='rin_emp') RIN.empno=el.value;
  else if(el.id==='rin_name') RIN.name=el.value;
  else if(el.id==='rin_bulk') RIN.bulk=el.value;
  else if(el.id==='deptOther') S.f.deptOther=el.value;
  else if(el.id==='empno'){ S.f.empno=el.value; if(S.f.nameLocked){S.f.nameLocked=false; var nn=document.getElementById('name'); if(nn) nn.readOnly=false;} }
  else if(el.id==='name') S.f.name=el.value;
  else if(el.dataset&&el.dataset.size!==undefined) S.f.size[+el.dataset.size]=el.value;
});

/* Enter key = go to the next step */
document.addEventListener('keydown',function(ev){
  if(ev.key!=='Enter'||ev.isComposing||ev.keyCode===229) return;
  if(S.view==='records'){ var tid=ev.target&&ev.target.id; if(tid==='pass'){ev.preventDefault();tryUnlock();} else if(tid==='rin_emp'||tid==='rin_name'){ev.preventDefault();rosterAdd();} return; }
  var tg=ev.target, tag=tg&&tg.tagName;
  /* step 3: Enter moves to the next field; Enter on the last field creates the form */
  if(S.step===3&&!S.made&&(tag==='INPUT'||tag==='SELECT')){
    var all=[].slice.call($app.querySelectorAll('input,select')).filter(function(e){
      if(e.disabled||e.type==='hidden') return false;
      if(e.type==='radio'){ var g=$app.querySelectorAll('input[name="'+e.name+'"]'); return g[0]===e; }
      return true; });
    var cur=tg; if(tg.type==='radio'){ cur=$app.querySelector('input[name="'+tg.name+'"]'); }
    var ix=all.indexOf(cur); ev.preventDefault();
    if(ix>=0&&ix<all.length-1){ var nx=all[ix+1]; nx.focus(); if(nx.select&&/^(text|date)$/.test(nx.type)) { try{nx.select();}catch(e){} } }
    else { var mk=document.getElementById('make'); if(mk) mk.click(); }
    return;
  }
  if(tag==='BUTTON'||tag==='SELECT'||tag==='TEXTAREA'||tag==='A') return;
  var id = S.step===1 ? 'to2'
    : S.step===2 ? (document.getElementById('to3')?'to3':document.getElementById('retry')?'retry':'check')
    : (S.made ? null : 'make');
  var b = id && document.getElementById(id);
  if(b && !b.disabled){ ev.preventDefault(); b.click(); }
});

function setQty(i,n){
  var it=ITEMS[i];
  if(it[4]==='p' && n>0){ /* only one pair of pants in total */
    ITEMS.forEach(function(o,j){ if(o[4]==='p' && j!==i){ S.f.qty[j]=0; var s=document.getElementById('qty'+j); if(s) s.value='0'; } });
  }
  S.f.qty[i]=n;
  ITEMS.forEach(function(o,j){ var c=document.getElementById('amt'+j); if(c) c.textContent = o[2]===null?'—':yen(lineAmt(j)); });
  var tt=document.getElementById('total'); if(tt) tt.textContent=yen(totalAmt());
}

function saveHTML(){
  if(S.save==='ing') return '<div class="muted">'+t('sv_ing')+'</div>';
  if(S.save==='ok') return '<div class="msg ok" role="status">'+t('sv_ok')+'</div>';
  if(S.save==='fail') return '<div class="msg warn" role="status">'+t('sv_fail')+'</div>';
  if(S.save==='off') return '<div class="msg warn" role="status">'+t('sv_off')+'</div>';
  return '';
}
function setSave(v){ S.save=v; var el=document.getElementById('savemsg'); if(el) el.innerHTML=saveHTML(); }

/* the server saves the request, checks the 6-month rule and the employee list */
function postRequest(){
  var f=S.f, items={};
  ITEMS.forEach(function(it,i){ var q=f.qty[i]||0; items['i'+(i+1)]=q?((f.size[i]||'')+'×'+q):''; });
  if(!S.docId) S.docId=Date.now().toString(36)+Math.random().toString(36).slice(2,9);
  return api('POST','/api/requests',{docId:S.docId,date:f.date,dept:deptVal(),team:f.team||'',empno:empNorm(f.empno),name:f.name.trim(),

function dupMessage(hits){
  var lines=hits.map(function(h){
    var nm=h.key==='pants'?t('dup_pants'):ITEMS[parseInt(h.key.slice(1),10)-1][L==='ja'?0:1];
    return t('dup_line').replace('{n}',nm).replace('{d}',fmtDate(new Date(h.at),L)).replace('{x}',fmtDate(new Date(h.next),L));
  });
  return t('dup_h')+'\n'+lines.join('\n')+'\n'+t('dup_hint');
}

/* ---------- records (admins only) ---------- */
function recRows(){ return (S.records||[]).slice(); }
function recHead(){
  var h=[t('c_saved'),t('c_date'),t('c_dept'),t('c_team'),t('c_emp'),t('c_name'),t('c_kind'),t('c_urg')];

function fmtSaved(iso){ var d=new Date(iso); if(isNaN(d)) return ''; return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }

  for(var i=1;i<=ITEMS.length;i++) row.push((r.items&&r.items['i'+i])||'');

function recMatrix(){ return [recHead()].concat(recRows().map(recRow)); }
function renderRecTable(){

  return pv+'<section class="card"><div><h2>'+t('rec_h')+'</h2><div class="muted">'+rows.length+t('rec_cnt')+'</div></div>'+body+
    '<div id="recmsg"></div><div class="actions"><button class="btn" id="csv" type="button"'+(rows.length?'':' disabled')+'>'+t('rec_csv')+'</button>'+
    (S.sheets&&S.sheets.enabled?'<button class="btn ghost" id="gsync" type="button">'+t('sync_btn')+(S.sheets.unsynced?' ('+S.sheets.unsynced+')':'')+'</button>':'')+
    '<button class="btn ghost" id="tsv" type="button"'+(rows.length?'':' disabled')+'>'+t('rec_tsv')+'</button>'+
    '<button class="btn ghost" id="recback" type="button">'+t('rec_back')+'</button></div></section>';

function renderGate(){

function renderRecords(){

function rosMsg(m){ RMSG=m; var el=document.getElementById('rosmsg'); if(el) el.innerHTML=m?'<div class="msg warn">'+esc(m)+'</div>':''; }
function loadRoster(){
  return api('GET','/api/admin/roster').then(function(j){ ROSTDOCS=(j.rows||[]).map(function(r){return {id:r.empno,empno:r.empno,name:r.name};}); ROSTERON=ROSTDOCS.length>0; if(S.view==='records'&&UNLOCKED&&TAB==='ros') render(); }).catch(function(){});
}
function rosterAdd(){
  if(!String(RIN.empno).trim()||!String(RIN.name).trim()){ rosMsg(t('ros_bad')); return; }
  api('POST','/api/admin/roster',{rows:[{empno:RIN.empno,name:RIN.name}]})
    .then(function(){ RIN.empno='';RIN.name='';RMSG=t('ros_ok'); return loadRoster(); })
    .then(function(){ render(); var el=document.getElementById('rin_emp'); if(el) el.focus(); })
    .catch(function(){ rosMsg(t('ros_fail')); });
}
function rosterBulk(){
  var rows=[]; RIN.bulk.split(/\r?\n/).forEach(function(line){ var m=/^\s*(\S+?)[\s,，\t\u3000]+(.+?)\s*$/.exec(line); if(m) rows.push({empno:m[1],name:m[2]}); });
  if(!rows.length){ rosMsg(t('ros_bad')); return; }
  api('POST','/api/admin/roster',{rows:rows}).then(function(j){ RIN.bulk=''; RMSG=(j.saved||rows.length)+t('ros_cnt')+' '+t('ros_ok'); return loadRoster(); }).then(function(){ render(); }).catch(function(){ rosMsg(t('ros_fail')); });
}
function rosterDel(id){ api('DELETE','/api/admin/roster/'+encodeURIComponent(id)).then(loadRoster).catch(function(){ rosMsg(t('ros_fail')); }); }
function showPhoto(id){
  api('GET','/api/admin/photo/'+encodeURIComponent(id)).then(function(j){ if(j&&/^data:image\//.test(j.data||'')){ PHOTOVIEW=j.data; render(); window.scrollTo(0,0); } }).catch(function(){});
}
function tryUnlock(){
  var el=document.getElementById('pass'); var v=el?el.value:'';
  api('POST','/api/admin/login',{passcode:v})
    .then(function(){ UNLOCKED=true; PASSERR=false; render(); startRecords(); })
    .catch(function(){ PASSERR=true; render(); var e2=document.getElementById('pass'); if(e2) e2.focus(); });
}
function lookupEmp(){
  var f=S.f, k=empNorm(f.empno);
  f.nameLocked=false;
  function paint(msg){
    var n=document.getElementById('name'); if(n){ n.value=f.name; n.readOnly=f.nameLocked; }
    var fe=document.getElementById('ferr'); if(fe) fe.innerHTML=msg?'<div class="msg bad" role="alert">'+esc(msg)+'</div>':'';
  }
  if(!k){ paint(''); return; }
  api('GET','/api/lookup?empno='+encodeURIComponent(k)).then(function(j){
    if(empNorm(S.f.empno)!==k) return;
    ROSTERON=!!j.rosterOn;
    var msg='';
    if(j.rosterOn){ if(j.found){ f.name=j.name; f.nameLocked=true; } else msg=t('e_notreg'); }
    paint(msg);
  }).catch(function(){ paint(''); });
}
function openRecords(){
  S.view='records'; S.rerr=''; render();
  if(UNLOCKED) startRecords();
}
function startRecords(){
  S.records=null;
  api('GET','/api/admin/requests').then(function(j){ S.records=j.rows||[]; S.sheets=j.sheets||{enabled:false,unsynced:0}; S.rerr=''; })
    .catch(function(e){ if(e.status===401){ UNLOCKED=false; } S.rerr='err'; })
    .then(function(){ if(S.view==='records') render(); });
  loadRoster();
}
function syncSheets(){
  recMsg('');
  api('POST','/api/admin/sync').then(function(j){
    if(!j.enabled) recMsg(t('sync_off'));
    else if(j.error) recMsg(t('sync_fail')+' '+j.error);
    else recMsg(j.added+' '+t('sync_ok'));
    startRecords();
  }).catch(function(){ recMsg(t('sync_fail')); });
}
function csvCell(c){ c=String(c); return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }
function recMsg(txt){ var el=document.getElementById('recmsg'); if(el) el.innerHTML=txt?'<div class="msg warn">'+esc(txt)+'</div>':''; }
function saveCSV(){
  var a=document.createElement('a'); a.href='/api/admin/export.csv'; a.download='uniform-requests.csv'; document.body.appendChild(a); a.click(); a.remove();
}
function copyMatrix(btn){
  var txt=recMatrix().map(function(r){return r.map(function(c){return String(c).replace(/[\t\r\n]+/g,' ');}).join('\t');}).join('\n'), label=btn.textContent;
  function ok(){ btn.textContent=t('copied'); setTimeout(function(){btn.textContent=label;},1600); }
  function fb(){ var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');ok();}catch(e){} document.body.removeChild(ta); }
  try{ navigator.clipboard.writeText(txt).then(ok,fb); }catch(e){ fb(); }
}

function makeForm(){
  var f=S.f, err='';
  if(!f.empno.trim()) err=t('e_empno');
  else if(!f.name.trim()) err=t('e_name');
  else if(!deptVal()) err=t('e_dept');
  else if(TEAMS[f.dept]&&!f.team) err=t('e_team');
  else if(!f.kind) err=t('e_kind');
  else {
    var any=false, miss=[];
    ITEMS.forEach(function(it,i){ if((f.qty[i]||0)>0){ any=true; if(it[4]!=='a' && !(f.size[i]||'').trim()) miss.push(L==='ja'?it[0]:it[1]);
      if(it[4]==='a' && !f.size[i]) err=t('e_ap'); }});
    if(!any) err=t('e_items');
    else if(miss.length) err=t('e_size')+miss.join(', ');
    else if(pantsCount()>1) err=t('pants_note');
    else if(!(f.d1&&f.d2&&f.d3)) err=t('e_decl');
  }
  if(err){ document.getElementById('ferr').innerHTML='<div class="msg bad" role="alert">'+esc(err)+'</div>'; S.err=err; return; }
  var btn=document.getElementById('make'); if(btn) btn.disabled=true;
  postRequest().then(function(res){
    if(res&&res.name) f.name=res.name;
    S.err=''; S.made=true; S.save='ok'; render(); window.scrollTo(0,0);
  }).catch(function(e){
    var d=(e&&e.data)||{}, msg;
    if(d.error==='dup') msg=dupMessage(d.hits||[]);
    else if(d.error==='notreg') msg=t('e_notreg');
    else if(d.error==='rate') msg=t('sv_busy');
    else msg=t('sv_fail');
    S.err=msg; render();
  });
}

function copyText(btn){
  var txt=sheetText(), label=btn.textContent;
  function ok(){ btn.textContent=t('copied'); setTimeout(function(){btn.textContent=label;},1600); }
  function fallback(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');ok();}catch(e){} document.body.removeChild(ta);
  }
  try{ navigator.clipboard.writeText(txt).then(ok,fallback); }catch(e){ fallback(); }
}

render();
})();
</script>
